name: Build AoFrio Tester (iOS IPA + Android APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

defaults:
  run:
    working-directory: mobile-app

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Empacotar Payload/Runner.app em AoFrioTester.ipa
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qr AoFrioTester.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: AoFrioTester.ipa
          path: mobile-app/build/ios/ipa/AoFrioTester.ipa
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9 # mesma versão que compila o APK localmente
          cache: true
      - run: flutter pub get
      - name: flutter build apk --release
        shell: bash
        run: |
          set -o pipefail
          if ! flutter build apk --release 2>&1 | tee build.log; then
            # Publica o motivo como anotação (legível sem acesso de admin ao log)
            grep -A12 -E "What went wrong|Error:|error:" build.log | head -60 \
              | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: mobile-app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
